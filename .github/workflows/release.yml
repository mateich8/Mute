name: Release

# Build GlassPlay.app and publish it as a GitHub Release whenever a tag
# named v* is pushed. No gh CLI or local binary needed.
#
#   git tag v1.0
#   git push origin v1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required for softprops/action-gh-release to publish.

jobs:
  release:
    runs-on: macos-26 # Apple Silicon (M4), provides the macOS 26 SDK.
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Zip the bundle
        run: ditto -c -k --keepParent GlassPlay.app GlassPlay.app.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: GlassPlay.app.zip
