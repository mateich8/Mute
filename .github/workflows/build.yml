name: Build

# Verifies every push and PR still compiles with the project's own build script.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26 # Apple Silicon (M4), provides the macOS 26 SDK Mute needs.
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build.sh

      - name: Verify the bundle launches
        run: |
          # `open` returns immediately; the launch attempt exercises linking/sig.
          open -n ./Mute.app
          sleep 5
          pgrep -x Mute >/dev/null || { echo "Mute did not launch"; exit 1; }
          echo "Mute is running"
          pkill -x Mute || true

      - name: Upload the .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Mute.app
          path: Mute.app
          if-no-files-found: error
