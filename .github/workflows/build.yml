name: Build

# Verifies every push and PR still compiles with the project's own build script.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26 # Apple Silicon (M4), provides the macOS 26 SDK GlassPlay needs.
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Verify the bundle launches
        run: |
          # `open` returns immediately; the launch attempt exercises linking/sig.
          open -n -a GlassPlay.app
          sleep 3
          pgrep -x GlassPlay >/dev/null && echo "GlassPlay is running"

      - name: Upload the .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: GlassPlay.app
          path: GlassPlay.app
          if-no-files-found: error
